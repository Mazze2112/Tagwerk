<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="theme-color" content="#5b4bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tagwerk</title>
<style>
:root{--bg:#f4f3ff;--card:#fff;--tx:#1d1b32;--mut:#7a7894;--ac:#5b4bff;--ac2:#ff6b9d;--ok:#2fbf8f;--warn:#ff6b4a;--line:#e6e4f7}
@media(prefers-color-scheme:dark){:root{--bg:#12111f;--card:#1e1c33;--tx:#f2f1ff;--mut:#9a98b8;--line:#2d2a4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 28px;border-radius:0 0 28px 28px}
header small{opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
header h1{margin:4px 0 14px;font-size:30px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .4s}
.sub{margin-top:8px;font-size:14px;opacity:.9}
main{padding:8px 16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 4px 8px}
h2.late{color:var(--warn)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 10px rgba(60,40,180,.08)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ac);background:none;color:#fff;font-size:16px;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;opacity:.5}
.body{flex:1;min-width:0}.t{font-weight:600;overflow-wrap:anywhere}
.m{font-size:13px;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ac);margin-right:6px}
.tag.f{background:#ffe3ee;color:#d6336c}
.ico{flex:none;background:none;border:0;font-size:20px;padding:6px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--card);padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button.tab{background:none;border:0;color:var(--mut);font-size:15px;font-weight:600;padding:10px 18px}
nav button.on{color:var(--ac)}
.fab{width:58px;height:58px;border-radius:50%;border:0;margin-top:-34px;font-size:32px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(91,75,255,.5)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
#sheet.open{display:flex}
form{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:grid;gap:12px}
input,textarea,button.go{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
.seg label{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}
.seg input{display:none}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--ac);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.fl{display:flex;gap:8px;align-items:center;font-size:14px}.fl input{width:auto}
button.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700}
</style></head><body>
<header><small id="dt"></small><h1 id="hi"></h1><div class="bar"><i id="pg"></i></div><div class="sub" id="ps"></div></header>
<main id="main"></main>
<nav><button class="tab on" data-t="heute">Heute</button><button class="fab" id="add">+</button><button class="tab" data-t="alle">Alle</button></nav>
<div id="sheet"><form id="f">
<div class="seg"><label><input type="radio" name="type" value="event" checked><span>Termin</span></label><label><input type="radio" name="type" value="todo"><span>Aufgabe</span></label></div>
<input name="title" placeholder="Titel" required>
<div class="row"><input type="date" name="date" required><input type="time" name="time" id="tm"></div>
<label class="fl" id="flx" hidden><input type="checkbox" name="flex">Keine feste Frist – das ist meine persönliche Deadline</label>
<textarea name="note" rows="2" placeholder="Notiz (optional)"></textarea>
<button class="go">Speichern</button></form></div>
<script>
const $=s=>document.querySelector(s);
let items=[];try{items=JSON.parse(localStorage.getItem('tw')||'[]')}catch(e){}
let tab='heute';
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const save=()=>{try{localStorage.setItem('tw',JSON.stringify(items))}catch(e){}render()};
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sort=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
function card(i){
  return `<div class="card ${i.done?'done':''}"><button class="chk" onclick="tg('${i.id}')">${i.done?'✓':''}</button>
  <div class="body"><div class="t">${esc(i.title)}</div><div class="m">${i.type=='todo'?`<span class="tag ${i.flex?'f':''}">${i.flex?'Meine Deadline':'Aufgabe'}</span>`:''}${tab=='alle'||i.date<iso(new Date())?fmt(i.date)+' ':''}${i.time?i.time+' Uhr':''}${i.note?'<br>'+esc(i.note):''}</div></div>
  <button class="ico" onclick="ex('${i.id}')">📅</button><button class="ico" onclick="rm('${i.id}')">🗑</button></div>`}
function sec(t,l,c){return l.length?`<h2 class="${c||''}">${t}</h2>`+l.map(card).join(''):''}
function render(){
  const T=iso(new Date()),n=new Date();
  $('#dt').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const h=n.getHours();$('#hi').textContent=h<11?'Guten Morgen ☀️':h<18?'Hallo 👋':'Guten Abend 🌙';
  const od=items.filter(i=>!i.done&&i.date<T).sort(sort),td=items.filter(i=>i.date==T).sort(sort);
  const open=od.length+td.filter(i=>!i.done).length;
  $('#pg').style.width=(td.length?td.filter(i=>i.done).length/td.length*100:0)+'%';
  $('#ps').textContent=open?`${open} ${open==1?'Punkt':'Punkte'} offen`:'Alles erledigt – gönn dir was! 🎉';
  try{navigator.setAppBadge&&(open?navigator.setAppBadge(open):navigator.clearAppBadge())}catch(e){}
  let o;
  if(tab=='heute')o=sec('Überfällig',od,'late')+sec('Heute',td)||'';
  else{const up=items.filter(i=>i.date>T).sort(sort);o=sec('Kommend',up)+sec('Erledigt',items.filter(i=>i.done&&i.date<=T).sort(sort).reverse().slice(0,10))}
  if(!o)o='<div class="empty">Nichts geplant.<br>Tippe auf + um etwas anzulegen.</div>';
  if(tab=='alle'&&items.some(i=>!i.done)&&items.filter(i=>i.date>T).length)o='<button class="go" style="margin-top:14px" onclick="exAll()">Alle offenen in Kalender exportieren</button>'+o;
  $('#main').innerHTML=o;
}
const tg=id=>{const i=items.find(x=>x.id==id);i.done=!i.done;save()};
const rm=id=>{if(confirm('Löschen?')){items=items.filter(x=>x.id!=id);save()}};
function ics(list){
  const p=n=>String(n).padStart(2,'0'),e=s=>(s||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n');
  const st=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
  let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Tagwerk//DE\r\n';
  for(const i of list){
    const d=i.date.replace(/-/g,'');let s,en;
    if(i.time){const x=new Date(i.date+'T'+i.time);x.setHours(x.getHours()+1);
      s='DTSTART:'+d+'T'+i.time.replace(':','')+'00';en='DTEND:'+iso(x).replace(/-/g,'')+'T'+p(x.getHours())+p(x.getMinutes())+'00'}
    else{const x=new Date(i.date+'T12:00');x.setDate(x.getDate()+1);s='DTSTART;VALUE=DATE:'+d;en='DTEND;VALUE=DATE:'+iso(x).replace(/-/g,'')}
    o+=`BEGIN:VEVENT\r\nUID:${i.id}@tagwerk\r\nDTSTAMP:${st}\r\nSUMMARY:${e(i.title)}\r\nDESCRIPTION:${e(i.note)}\r\n${s}\r\n${en}\r\nBEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Erinnerung\r\nEND:VALARM\r\nEND:VEVENT\r\n`}
  return o+'END:VCALENDAR\r\n'}
async function dl(list,name){
  const f=new File([ics(list)],name+'.ics',{type:'text/calendar'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
const ex=id=>{const i=items.find(x=>x.id==id);dl([i],'termin')};
const exAll=()=>dl(items.filter(i=>!i.done&&i.date>=iso(new Date())),'tagwerk');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));render()});
const f=$('#f'),typ=()=>{const t=f.type.value=='todo';$('#flx').hidden=!t};
f.querySelectorAll('[name=type]').forEach(r=>r.onchange=typ);
$('#add').onclick=()=>{f.reset();f.date.value=iso(new Date());typ();$('#sheet').classList.add('open')};
$('#sheet').onclick=e=>{if(e.target.id=='sheet')$('#sheet').classList.remove('open')};
f.onsubmit=e=>{e.preventDefault();items.push({id:Date.now().toString(36),type:f.type.value,title:f.title.value.trim(),date:f.date.value,time:f.time.value,flex:f.type.value=='todo'&&f.flex.checked,note:f.note.value.trim(),done:false});$('#sheet').classList.remove('open');save()};
document.addEventListener('visibilitychange',render);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
